[package]
name = "tix-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "string"] }
comfy-table = { version = "8.0.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tix-core = { version = "0.1.0", path = "../tix-core" }
ulid = { version = "3.0.0", default-features = false }

[dev-dependencies]
proptest = "1.11.0"
