# Builds the standalone `tix` binary for each platform and attaches it to the
# GitHub release for a `v*` tag. install.sh downloads these assets.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: wasm32-wasip1, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build -p tix-cli --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p out
          dir="target/${{ matrix.target }}/release"
          case "${{ matrix.target }}" in
            *windows*) (cd "$dir" && 7z a "$GITHUB_WORKSPACE/out/tix-${{ matrix.target }}.zip" tix.exe) ;;
            wasm32-wasip1) cp "$dir/tix.wasm" out/tix.wasm ;;
            *) tar -C "$dir" -czf "out/tix-${{ matrix.target }}.tar.gz" tix ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: tix-${{ matrix.target }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
